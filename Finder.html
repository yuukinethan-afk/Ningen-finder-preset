<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150d38">
<title>Finder preset By Ningen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0a1f;--night:#120c2e;--panel:#221757;--line:#4a3b8f;--paper:#fff4e6;--mut:#b9aee0;--pink:#ff4f8b;--cyan:#35e0ff;--yel:#ffd84a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--paper);font:500 16px/1.55 "Zen Maru Gothic",system-ui,sans-serif;
background:radial-gradient(rgba(255,79,139,.13) 1.5px,transparent 1.6px) 0 0/16px 16px,linear-gradient(180deg,#1b1244,#120c2e 60%);background-attachment:fixed}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;border-bottom:4px solid var(--paper);background:linear-gradient(180deg,#1a1042,#0e0a1f)}
.eye{position:absolute;top:0;left:50%;z-index:0;width:min(100%,560px);height:min(62vw,348px);transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 68%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 68%,transparent 100%)}
.eye video{display:block;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;z-index:1;height:60%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(14,10,31,.6))}
.hero .in{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:min(52vw,290px) 18px 30px}
h1{position:relative;margin:0;font-family:"Dela Gothic One","Zen Maru Gothic",system-ui,sans-serif;font-weight:400;letter-spacing:-.01em}
h1 .l1{display:block;font-size:clamp(38px,13vw,60px);line-height:1.04;transform:skewX(-6deg);transform-origin:left bottom;text-shadow:3px 3px 0 var(--pink)}
h1 .l2{display:inline-block;margin-top:12px;padding:3px 16px;font-size:clamp(18px,6vw,26px);background:var(--yel);color:var(--ink);transform:skewX(-8deg)}
p.sub{position:relative;max-width:34ch;margin:18px 0 0;color:var(--mut);font-size:15px}
@media (prefers-reduced-motion:no-preference){
  h1 .l1{animation:slam .55s cubic-bezier(.2,.9,.25,1.1) both}
  h1 .l2{animation:slam2 .55s .18s cubic-bezier(.2,.9,.25,1.1) both}
  @keyframes slam{from{opacity:0;transform:translateX(-36px) skewX(-6deg)}to{opacity:1;transform:translateX(0) skewX(-6deg)}}
  @keyframes slam2{from{opacity:0;transform:translateX(36px) skewX(-8deg)}to{opacity:1;transform:translateX(0) skewX(-8deg)}}
}

main{max-width:560px;margin:0 auto;padding:26px 16px 56px}

/* search */
.box{display:flex;gap:8px;align-items:center;border:3px solid var(--paper);border-radius:8px;padding:5px 5px 5px 14px;background:var(--ink);box-shadow:5px 5px 0 var(--cyan)}
.box:focus-within{border-color:var(--cyan);box-shadow:5px 5px 0 var(--pink)}
.box input{flex:1;min-width:0;background:none;border:0;color:var(--paper);font:inherit;outline:0;padding:11px 0}
.box input::placeholder{color:#7f73ad}
.x{background:none;border:0;color:var(--mut);font-size:24px;line-height:1;padding:8px 12px;cursor:pointer}
.btn{display:inline-block;background:var(--pink);color:var(--ink);border:3px solid var(--paper);border-radius:8px;box-shadow:4px 4px 0 var(--cyan);font:900 16px "Zen Maru Gothic",system-ui,sans-serif;padding:10px 24px;cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn.s{background:var(--panel);color:var(--paper);font-weight:700}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--cyan)}
.btn:disabled{opacity:.7;cursor:progress}
.btn:focus-visible,.x:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.go{margin-top:20px}
.err{color:#ff9db1;font-size:14px;margin-top:14px}

/* result */
.chip{display:block;margin:26px 0 0;padding:7px 16px;border:2px solid var(--line);border-radius:999px;color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vidwrap{max-width:325px;margin:22px auto 26px}
.vid{aspect-ratio:325/740;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--ink);border:3px solid var(--paper);border-radius:6px;box-shadow:7px 7px 0 var(--cyan)}
.vid iframe{display:block;width:100%;height:100%;border:0}
.vph{padding:22px;color:var(--mut);font-size:14px}
.vph a{display:inline-block;margin-top:12px;color:var(--cyan);font-weight:700}
.cap{margin:0 0 22px;word-break:break-word}
.cap .h{color:var(--cyan)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:30px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.stats>div{padding:14px 4px 14px 2px;border-bottom:1px solid var(--line)}
.stats>div:nth-child(odd){border-right:1px solid var(--line);padding-right:12px}
.stats>div:nth-child(even){padding-left:16px}
.stats>div:nth-last-child(-n+2){border-bottom:0}
.stats small{display:block;color:var(--mut);font-size:13px;margin-bottom:2px}
.stats b{font:400 21px "Dela Gothic One","Zen Maru Gothic",sans-serif;word-break:break-word}

.ph{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.ph i{display:block;flex:0 0 46px;height:12px;background:var(--pink);transform:skewX(-24deg)}
.ph h2{margin:0;font:400 24px "Dela Gothic One","Zen Maru Gothic",sans-serif}
.cnt{margin-left:auto;background:var(--yel);color:var(--ink);border-radius:6px;padding:1px 14px;font:400 18px "Dela Gothic One",sans-serif}

.pc{display:flex;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.pc.own{border-color:var(--pink)}
.th{position:relative;flex:0 0 84px;height:84px;display:grid;place-items:center;background:var(--ink);border-radius:4px;font:400 15px "Dela Gothic One",sans-serif}
.th:before,.th:after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--pink)}
.th:before{top:8px;left:8px;border-right:0;border-bottom:0}
.th:after{bottom:8px;right:8px;border-left:0;border-top:0}
.pb{min-width:0;flex:1}
.pb h3{margin:0 0 6px;font-size:18px;font-weight:900;word-break:break-word}
.bd{display:inline-block;margin-bottom:6px;padding:0 10px;border:2px solid var(--cyan);border-radius:4px;background:var(--ink);color:var(--cyan);font-size:13px;font-weight:900}
.bd.g{margin-left:6px;border-color:var(--pink);background:var(--pink);color:var(--ink)}
.by{color:var(--mut);font-size:14px}
.url{margin:6px 0 12px;font:13px/1.4 ui-monospace,monospace;color:var(--mut);word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{padding:7px 14px;font-size:14px;box-shadow:3px 3px 0 var(--cyan)}

.card{margin-bottom:26px;padding:14px;background:var(--panel);border:2px solid var(--line);border-radius:6px}
.card label{display:block;margin:0 0 6px;font-size:14px;font-weight:700}
textarea{width:100%;min-height:70px;margin-bottom:10px;padding:10px;background:var(--ink);color:var(--paper);border:2px solid var(--line);border-radius:6px;font:inherit;font-size:14px;resize:vertical}
textarea:focus-visible{outline:0;border-color:var(--cyan)}
.note,.empty{color:var(--mut);font-size:13px}
.empty{padding:16px;border:2px dashed var(--line);border-radius:6px}
[hidden]{display:none}
</style>
</head>
<body>
<header class="hero">
<div class="eye" aria-hidden="true"><video id="bgv" src="bg.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture tabindex="-1"></video></div>
<div class="in">

<h1><span class="l1">Finder preset</span> <span class="l2">By Ningen</span></h1>
<p class="sub">Tempel link TikTok edit, temukan link preset dari caption dan komentar.</p>
</div>
</header>

<main>
<div class="box">
<input id="url" type="url" inputmode="url" placeholder="https://vt.tiktok.com/..." autocomplete="off" aria-label="Link TikTok">
<button class="x" id="clr" aria-label="Hapus">×</button>
</div>
<button class="btn go" id="go">Search</button>
<button class="btn s go" id="demo" style="margin-left:6px">Lihat contoh</button>
<div class="err" id="err" hidden></div>

<div id="res" hidden>
<span class="chip" id="chip"></span>
<div class="vidwrap"><div class="vid" id="vid"></div></div>
<p class="cap" id="cap"></p>
<div class="stats">
<div><small>Akun</small><b id="acc">-</b></div>
<div><small>Komentar</small><b id="com">-</b></div>
<div><small>Views</small><b id="vw">-</b></div>
<div><small>Likes</small><b id="lk">-</b></div>
</div>

<div class="card" id="manual">
<label for="cin">Caption</label>
<textarea id="cin" placeholder="Tempel caption video"></textarea>
<label for="min">Komentar (satu per baris, format: username: isi komentar)</label>
<textarea id="min" placeholder="muhamad.azmi094: https://alightcreative.com/am/share/..."></textarea>
<div class="note" id="dbg">Terisi otomatis dari backend. Bisa juga diisi manual.</div>
</div>

<div class="ph"><i></i><h2>Link preset</h2><span class="cnt" id="n">0</span></div>
<div id="list"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){const v=$('bgv');if(v){v.removeAttribute('autoplay');v.pause()}}
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const valid=u=>/^https?:\/\/((www|vt|vm|m)\.)?tiktok\.com\/.+/i.test(u);

// Sambungkan backend di sini. Kembalikan:
// {caption, account, views, likes, comments, commentList:[{user,text}]}
async function fetchTikTok(url){
  const r=await fetch('/api/find?url='+encodeURIComponent(url));
  if(!r.ok) throw new Error('gagal');
  return r.json();
}

const HOSTS=[[/alightcreative\.com|alight\.link/i,'SHARE'],[/drive\.google\.com|docs\.google\.com/i,'DRIVE'],[/mediafire\.com/i,'MEDIAFIRE'],[/mega\.nz/i,'MEGA'],[/t\.me\//i,'TELEGRAM'],[/pixeldrain\.com|gofile\.io|dropbox\.com|terabox\.com|sfile\.mobi/i,'FILE'],[/bit\.ly|s\.id|linktr\.ee|trakteer\.id|saweria\.co/i,'LINK']];
const LINK=/(?:https?:\/\/)?(?:www\.)?(?:alightcreative\.com|alight\.link|drive\.google\.com|docs\.google\.com|mediafire\.com|mega\.nz|t\.me|bit\.ly|s\.id|linktr\.ee|pixeldrain\.com|gofile\.io|dropbox\.com|terabox\.com|sfile\.mobi|trakteer\.id|saweria\.co)\/?[^\s]*/gi;

function findPresets(caption,list){
  const cr=(caption.match(/CR\s*[:：]?\s*(@[\w.]+)/i)||[])[1]||'';
  const out=[],seen=new Set();
  list.concat([{user:'',text:caption}]).forEach(c=>{
    [...new Set((c.text.match(LINK)||[]).concat(c.text.match(/https?:\/\/[^\s]+/gi)||[]))].forEach(u=>{
      u=u.replace(/[.,)!]+$/,'');
      if(!/^https?:\/\//i.test(u))u='https://'+u;
      const h=HOSTS.find(([r])=>r.test(u))||(/tiktok\.com|tiktokcdn/i.test(u)?null:[0,'LINK']);
      if(!h||seen.has(u))return;
      seen.add(u);
      const ratio=(c.text.match(/\b(9:16|16:9|1:1|4:5)\b/)||[])[1]||'9:16';
      out.push({u,type:h[1],ratio,user:c.user,reply:c.reply,title:ratio+' '+(cr||c.user||'preset')});
    });
  });
  return out;
}

function parseComments(t){
  return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^@?([\w.]+)(\s*\(balasan\))?\s*:\s*(.*)$/);
    return m?{user:'@'+m[1],reply:!!m[2],text:m[3]}:{user:'',text:l};
  });
}

function render(){
  const cap=$('cin').value;
  $('cap').innerHTML=esc(cap).replace(/(#[\w.]+)/g,'<span class="h">$1</span>');
  const items=findPresets(cap,parseComments($('min').value));
  const me=$('acc').textContent;
  items.sort((a,b)=>(b.user===me)-(a.user===me));
  $('n').textContent=items.length;
  $('list').innerHTML=items.length?items.map((p,i)=>`
  <div class="pc${p.user&&p.user===me?' own':''}"><div class="th">${esc(p.ratio)}</div><div class="pb">
  <h3>${esc(p.title)}</h3><span class="bd">${p.type}</span>
  ${p.user&&p.user===me?'<span class="bd g">Dari pemilik video</span>':''}
  <div class="by">${esc(p.user)}${p.reply?' (balasan)':''}</div>
  <div class="url">${esc(p.u)}</div>
  <div class="acts"><a class="btn" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer">Buka preset</a>
  <button class="btn s" data-i="${i}">Salin link</button></div></div></div>`).join('')
  :'<div class="empty">Belum ada link preset. Tempel komentar yang berisi link Alight Motion, Google Drive, atau MediaFire.</div>';
  $('list').querySelectorAll('button[data-i]').forEach(b=>b.onclick=async()=>{
    const u=items[b.dataset.i].u;
    try{await navigator.clipboard.writeText(u)}catch(_){const t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(__){}t.remove()}
    b.textContent='Tersalin';setTimeout(()=>b.textContent='Salin link',1500);
  });
}

// ---------- Video TikTok ----------
let vidFor='';
const vidId=(url,id)=>String(id||'').replace(/\D/g,'')||((String(url).match(/\/video\/(\d+)/)||[])[1]||'');
function videoLoading(){
  vidFor='';
  $('vid').innerHTML='<div class="vph">Memuat video...</div>';
}
function setVideo(id){
  if(!id||vidFor===id)return;
  vidFor=id;
  $('vid').innerHTML='<iframe src="https://www.tiktok.com/embed/v2/'+id+'" title="Pratinjau video TikTok" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
}
function videoMissing(url){
  if(vidFor)return;
  $('vid').innerHTML='<div class="vph">Video belum bisa ditampilkan di sini.<br><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Buka video di TikTok</a></div>';
}

function show(url,d){
  $('res').hidden=false;$('chip').textContent=url;
  videoLoading();setVideo(vidId(url,d.id));
  $('acc').textContent=d.account||'-';$('com').textContent=d.comments??'-';
  $('vw').textContent=d.views||'-';$('lk').textContent=d.likes||'-';
  $('cin').value=d.caption||'';
  $('min').value=(d.commentList||[]).map(c=>c.user+': '+c.text).join('\n');
  const g=d.debug;
  $('dbg').textContent=g?('Dibaca '+g.dibaca+' dari '+g.total+' komentar + '+g.balasan+' balasan.'+(g.error&&g.error.length?' Error: '+g.error.join('; '):'')):'Isi manual atau coba lagi.';
  render();
}

function handle(ev,e){
  if(ev.type==='info'){
    $('acc').textContent=ev.account||'-';$('com').textContent=ev.comments??'-';
    $('vw').textContent=ev.views||'-';$('lk').textContent=ev.likes||'-';
    $('cin').value=ev.caption||'';
    setVideo(vidId($('chip').textContent,ev.id));
    render();
  }else if(ev.type==='comments'){
    const m=$('min');
    m.value+=(m.value?'\n':'')+ev.list.map(c=>c.user+(c.reply?' (balasan)':'')+': '+c.text).join('\n');
    $('dbg').textContent='Mencari ('+(ev.sumber||'')+')... '+ev.dibaca+' dari '+ev.total+' komentar, '+ev.balasan+' balasan';
    render();
  }else if(ev.type==='done'){
    $('dbg').textContent='Selesai ('+(ev.sumber||'')+'). Dibaca '+ev.dibaca+' dari '+ev.total+' komentar + '+ev.balasan+' balasan.'+(ev.error&&ev.error.length?' Error: '+ev.error.join('; '):'');
  }else if(ev.type==='error'){
    e.textContent='Gagal mengambil data: '+ev.message+'. Isi caption dan komentar manual di bawah.';e.hidden=false;
  }
}

async function search(){
  const u=$('url').value.trim(),e=$('err');e.hidden=true;
  if(!valid(u)){e.textContent='Link tidak valid. Tempel link dari TikTok, contoh: https://vt.tiktok.com/xxxx/';e.hidden=false;$('res').hidden=true;return}
  const b=$('go');b.disabled=true;b.textContent='Mencari...';
  show(u,{});$('dbg').textContent='Mengambil data...';
  try{
    const r=await fetch('/api/stream?url='+encodeURIComponent(u));
    if(!r.ok||!r.body)throw new Error('gagal');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(line.trim())handle(JSON.parse(line),e)}
    }
  }catch(_){e.textContent='Gagal terhubung ke backend. Isi caption dan komentar manual di bawah.';e.hidden=false}
  videoMissing(u);
  b.disabled=false;b.textContent='Search';
}
$('go').onclick=search;
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('clr').onclick=()=>{$('url').value='';$('res').hidden=true;$('url').focus()};
$('cin').addEventListener('input',render);$('min').addEventListener('input',render);
$('demo').onclick=()=>{
  $('url').value='https://vt.tiktok.com/ZSbm1s1vT/';$('err').hidden=true;
  show($('url').value,{account:'@masraysz_am',comments:364,views:'1.2 M',likes:'61.9 K',
  caption:'.#masraysz_am || kece nih - .#jj .#presetalightmotion .#foryou .#gemsergemser CR:@weynpreset01',
  commentList:[{user:'@muhamad.azmi094',text:'9:16 https://alightcreative.com/am/share/u/NSbRtZoZdlUQVheD9l5pn8ieMXu1/p/cg4FcpJ4Z3-b68e44ae85835df5'},
  {user:'@muhamad.azmi094',text:'xml https://drive.google.com/file/d/1AbCdEfGhIjKlMnOp/view'}]});
  videoMissing($('url').value);
};
</script>
</body>
</html>
